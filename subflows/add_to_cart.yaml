# subflows/add_to_cart.yaml
appId: com.saucelabs.mydemoapp.android
---
- scrollUntilVisible:
    element: "Add to cart"
    direction: DOWN
# 2. Perform the action
- tapOn: "Add to cart"
   

# 3. Verify the action worked (e.g., cart badge shows "1")
- assertVisible:
    id: "com.saucelabs.mydemoapp.android:id/cartTV"
- assertVisible:
    text: "1"
    