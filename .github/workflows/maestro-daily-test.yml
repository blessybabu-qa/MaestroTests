name: Maestro Scheduled UI Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    # Runs at 01:00 UTC every day
    - cron: '0 1 * * *'

jobs:
  maestro-test:
    runs-on: macos-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Maestro
        run: |
          curl -Ls "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> $GITHUB_PATH

      - name: Run Maestro Tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          target: google_apis
          arch: x86_64
          script: |
            # Install your app
            adb install app/build/outputs/apk/debug/app-debug.apk
            
            # Run Maestro with Secrets passed as env variables
            # --format junit generates a detailed XML report for the summary
            maestro test \
              -e USERNAME="${{ secrets.MAESTRO_USERNAME }}" \
              -e PASSWORD="${{ secrets.MAESTRO_PASSWORD }}" \
              --format junit \
              --output report.xml \
              .maestro/your_flow.yaml

      - name: Upload Test Report and Screenshots
        if: always() # Ensures reports are uploaded even if tests fail
        uses: actions/upload-artifact@v4
        with:
          name: maestro-test-artifacts
          path: |
            report.xml
            ~/.maestro/tests/