name: Maestro Scheduled UI Tests

on:
  push:
    branches: [ main ]
  schedule:
    - cron: '0 1 * * *'
  workflow_dispatch: 

jobs:
  maestro-test:
    runs-on: macos-latest 
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Removed Java & Build steps because this repo only contains Maestro flows
      # If you have an APK file in this repo, ensure the path below is correct.

      - name: Install Maestro
        run: |
          curl -Ls "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> $GITHUB_PATH

      - name: Run Maestro Tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          # FIX: Matches the aarch64 (Apple Silicon) host architecture
          arch: arm64-v8a
          profile: pixel_6
          script: |
            # 1. Provide the path to your APK. 
            # If it's not in the repo, you may need to download it from a URL or previous build
            # adb install path/to/your/app.apk 
            
            # 2. Run your main test flow from your 'flows' folder
            maestro test \
              -e USER_NAME="${{ secrets.USER_NAME }}" \
              -e USER_PWD="${{ secrets.USER_PWD }}" \
              --format junit \
              --output report.xml \
              flows/mydemoapp_test.yaml

      - name: Upload Test Report & Screenshots
        if: always() 
        uses: actions/upload-artifact@v4
        with:
          name: maestro-results
          path: |
            report.xml
            ~/.maestro/tests/