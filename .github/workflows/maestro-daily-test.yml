name: Maestro Scheduled UI Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    # Runs at 01:00 UTC every day
    - cron: '0 1 * * *'
  workflow_dispatch: 

jobs:
  maestro-test:
    runs-on: macos-latest 
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Build Debug APK
        run: ./gradlew assembleDebug

      - name: Install Maestro
        run: |
          curl -Ls "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> $GITHUB_PATH

      - name: Run Maestro Tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: arm64-v8a
          profile: pixel_6
          script: |
            # Install the APK
            adb install app/build/outputs/apk/debug/app-debug.apk
            
            # Use the exact secret names from your repository settings
            maestro test \
              -e USER_NAME="${{ secrets.USER_NAME }}" \
              -e USER_PWD="${{ secrets.USER_PWD }}" \
              --format junit \
              --output report.xml \
              .maestro/your_flow.yaml

      - name: Upload Test Report & Screenshots
        if: always() 
        uses: actions/upload-artifact@v4
        with:
          name: maestro-failure-results
          path: |
            report.xml
            ~/.maestro/tests/
          # Retention period can be added to save storage
          retention-days: 7