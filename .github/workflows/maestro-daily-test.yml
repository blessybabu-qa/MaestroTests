- name: Run Maestro Tests
  uses: reactivecircus/android-emulator-runner@v2
  with:
        # API 29 is the "Stability King" for CI emulators
          api-level: 29
          target: google_apis
          arch: arm64-v8a
          profile: pixel_6
          force-avd-creation: false
          disable-animations: true
          # We add -accel off to stop the HVF crash, and keep swiftshader for the GPU
          emulator-options: >
            -no-window 
            -gpu swiftshader_indirect 
            -no-snapshot 
            -noaudio 
            -no-boot-anim 
            -accel off
          
          script: |
            # 1. Wait for Android to be fully ready
            echo "Waiting for Android to boot..."
            adb wait-for-device
            while [ "$(adb shell getprop sys.boot_completed | tr -d '\r')" != "1" ]; do
              echo "Still booting... sleeping 5s"
              sleep 5
            done
            echo "Android is ready!"

            # 2. Download the Sauce Labs APK
            curl -L "https://github.com/saucelabs/my-demo-app-android/releases/download/2.0.1/mda-2.0.1-22.apk" -o myapp.apk
            
            # 3. Install the APK
            adb install myapp.apk
            
            # 4. Run your Maestro flow
            maestro test \
            -e USER_NAME="${{ secrets.USER_NAME }}" \
            -e USER_PWD="${{ secrets.USER_PWD }}" \
            --format junit \
            -output report.xml \
            flows/mydemoapp_test.yaml

- name: Upload Test Report & Screenshots
  if: always() 
  uses: actions/upload-artifact@v4
  with:
  name: maestro-results
  path: |
    report.xml
    ~/.maestro/tests/