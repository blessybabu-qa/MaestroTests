name: Maestro Cloud E2E

on:
  schedule:
    # 00:00 UTC is 01:00 AM CET (German Standard Time)
    - cron: '0 0 * * *' 
  push:
    branches: [ main ]
  workflow_dispatch: 

jobs:
  maestro-cloud:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download Demo APK
        run: |
          echo "Downloading target APK..."
          curl -L "https://github.com/saucelabs/my-demo-app-android/releases/download/2.0.1/mda-2.0.1-22.apk" -o myapp.apk

      - name: Run Maestro Cloud Action
        id: maestro-upload
        uses: mobile-dev-inc/action-maestro-cloud@v2
        with:
          api-key: ${{ secrets.MAESTRO_CLOUD_API_KEY }}
          project-id: ${{ secrets.MAESTRO_PROJECT_ID }}
          app-file: myapp.apk
          workspace: flows/
          env: |
            USER_NAME=${{ secrets.USER_NAME }}
            USER_PWD=${{ secrets.USER_PWD }}

      - name: Display Report Link
        if: always()
        run: |
          echo "View Results: ${{ steps.maestro-upload.outputs.MAESTRO_CLOUD_CONSOLE_URL }}"