name: Maestro Scheduled UI Tests

on:
  push:
    branches: [ main ]
  schedule:
    # Runs at 01:00 UTC every day
    - cron: '0 1 * * *'
  workflow_dispatch: 

jobs:
  maestro-test:
    runs-on: macos-latest 
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Maestro
        run: |
          curl -Ls "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> $GITHUB_PATH

      - name: Run Maestro Tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: arm64-v8a
          profile: pixel_6
          
          force-avd-creation: false
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
        
          script: |
            # 1. Download the Sauce Labs My Demo App APK automatically
            curl -L "https://github.com/saucelabs/my-demo-app-android/releases/download/2.0.1/mda-2.0.1-22.apk" -o mydemoapp.apk
            
            # 2. Install it
            adb install mydemoapp.apk
            
            # 3. Run your specific test file
            maestro test \
              -e USER_NAME="${{ secrets.USER_NAME }}" \
              -e USER_PWD="${{ secrets.USER_PWD }}" \
              --format junit \
              --output report.xml \
              flows/mydemoapp_test.yaml

      - name: Upload Test Report & Screenshots
        if: always() 
        uses: actions/upload-artifact@v4
        with:
          name: maestro-results
          path: |
            report.xml
            ~/.maestro/tests/