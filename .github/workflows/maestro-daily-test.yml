with:
          api-level: 30
          target: google_apis
          arch: arm64-v8a
          profile: pixel_6
          force-avd-creation: false
          disable-animations: true
          # THIS LINE FIXES THE HVF ERROR:
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          
          script: |
            # The wait loop ensures the 'HVF' failure doesn't stop the boot
            echo "Waiting for Android to boot..."
            adb wait-for-device
            while [ "$(adb shell getprop sys.boot_completed | tr -d '\r')" != "1" ]; do
              sleep 5
            done
            
            # Now install the Sauce App
            curl -L "https://github.com/saucelabs/my-demo-app-android/releases/download/2.0.1/mda-2.0.1-22.apk" -o myapp.apk
            adb install myapp.apk
            
            # Run your Maestro flows
            maestro test flows/mydemoapp_test.yaml