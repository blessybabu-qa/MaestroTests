name: Maestro Test

on:
  schedule:
    - cron: '0 1 * * *'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Maestro
        run: curl -Ls "https://get.maestro.mobile/release/latest/maestro-cli" | bash

      - name: Run Tests on Android Emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          target: google_apis
          arch: x86
          profile: pixel_6
          script: |
            # Wait for emulator to be ready
            echo "Waiting for emulator to boot..."
            adb wait-for-device
            sleep 30

            # Wait for system to fully boot
            for i in {1..60}; do
              if [ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = "1" ]; then
                echo "Emulator is ready!"
                break
              fi
              echo "Still waiting... ($i/60)"
              sleep 2
            done

            # Download APK
            echo "Downloading APK..."
            curl -L "https://github.com/saucelabs/my-demo-app-android/releases/download/2.0.1/mda-2.0.1-22.apk" -o myapp.apk

            # Install APK
            echo "Installing APK..."
            adb install myapp.apk

            # Run Maestro tests
            echo "Running Maestro tests..."
            export PATH="$PATH:$HOME/.maestro/bin"
            maestro test \
              -e USER_NAME="${{ secrets.USER_NAME }}" \
              -e USER_PWD="${{ secrets.USER_PWD }}" \
              flows/sauce_test.yaml

      - name: Upload Screenshots on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failure-screenshots
          path: ~/.maestro/
          retention-days: 7
