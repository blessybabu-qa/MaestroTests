name: Maestro Local E2E

on:
  workflow_dispatch: # Enables your manual "Run workflow" button
  push:
    branches: [main, master]

jobs:
  mobile-tests:
    # IMPORTANT: Ubuntu will fail; you must use macOS for local emulators
    runs-on: macos-latest 
    timeout-minutes: 30

    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: 🛠️ Install Maestro CLI
        run: |
          curl -Ls "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> $GITHUB_PATH

      - name: 📥 Download Demo APK
        run: |
          curl -L "https://github.com/saucelabs/my-demo-app-android/releases/download/2.0.1/mda-2.0.1-22.apk" -o myapp.apk

      - name: 📱 Run Android Emulator & Tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          profile: Pixel_6
          script: |
            # 1. Install the downloaded APK
            adb install myapp.apk
            
            # 2. Run Maestro with your ENV variables
            # We pass the secrets here so your .yaml flows can use them
            maestro test . \
              -e USER_NAME=${{ secrets.USER_NAME }} \
              -e USER_PWD=${{ secrets.USER_PWD }}
