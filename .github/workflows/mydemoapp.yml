name: Maestro Local E2E

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  mobile-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: ⚙️ Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: ☕ Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 🛠️ Install Maestro CLI
        run: |
          curl -Ls "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> $GITHUB_PATH

      - name: 📥 Download Demo APK
        run: |
          curl -L "https://github.com/saucelabs/my-demo-app-android/releases/download/2.0.1/mda-2.0.1-22.apk" -o myapp.apk

      - name: 📱 Run Android Emulator & Tests
        uses: reactivecircus/android-emulator-runner@v2
        env:
          USER_NAME: ${{ secrets.USER_NAME }}
          USER_PWD: ${{ secrets.USER_PWD }}
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          # The runner executes the script line by line, so each command must stay on one line
          script: |
            adb wait-for-device
            adb install myapp.apk
            maestro test flows/mydemoapp_test.yaml -e USER_NAME="$USER_NAME" -e USER_PWD="$USER_PWD" --format junit --output report.xml --debug-output maestro-debug

      - name: 📤 Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maestro-results
          path: |
            report.xml
            maestro-debug/
